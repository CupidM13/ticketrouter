[project]
name = "ticketrouter"
version = "0.1.0"
description = "End-to-end LLM fine-tuning and MLOps lifecycle for enterprise support-ticket intent routing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=3.0.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "transformers>=4.45.0",
    "peft>=0.13.0",
    "trl>=0.12.0",
    "accelerate>=1.0.0",
    "torch>=2.4.0",
    "mlflow>=2.17.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "streamlit>=1.39.0",
    "google-genai>=1.0.0",
    "pytest>=8.3.0",
    "ruff>=0.7.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "requests>=2.32.0",
    "kaggle>=2.2.5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
