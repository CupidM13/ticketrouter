name: TicketRouter CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    name: Lint, Test, and Model Promotion Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.26"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint and Format check with Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run Pytest test suite
        run: |
          uv run pytest -v

      - name: Verify Model Promotion Gate (Passing Candidate)
        run: |
          uv run python -m ticketrouter.gate \
            --candidate-metrics metrics/candidate_metrics.json \
            --production-metrics metrics/production_metrics.json \
            --no-promote

      - name: Verify Model Promotion Gate Rejection (Deliberately Bad Candidate)
        run: |
          if uv run python -m ticketrouter.gate \
            --candidate-metrics metrics/candidate_metrics.json \
            --production-metrics metrics/production_metrics.json \
            --bad-candidate; then
            echo "Error: Gate should have failed on bad candidate!"
            exit 1
          else
            echo "Success: Gate correctly rejected bad candidate."
          fi

  docker-build:
    name: Docker Container Build
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t ticketrouter:latest .

  k8s-validate:
    name: Kubernetes Manifest Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Kubernetes Manifests with Kubeconform
        uses: docker://ghcr.io/yannh/kubeconform:latest
        with:
          entrypoint: /kubeconform
          args: "-summary -strict -kubernetes-version 1.30.0 k8s/"
