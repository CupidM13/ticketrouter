apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ticketrouter-hpa
  labels:
    app: ticketrouter
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ticketrouter-serving
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
